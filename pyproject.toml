[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-cli"
version = "1.0.0"
description = "Modern, high-performance Telegram CLI and TUI client for developers and terminal power-users."
authors = [{name = "Antigravity Pair Programmer"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "telethon>=1.35.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "qrcode>=7.4.0",
]

[project.scripts]
tg = "tgcli.cli:main"
tgcli = "tgcli.cli:main"
